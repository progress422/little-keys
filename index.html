<title>Little Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Music&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen app. Top bar, song shelf, control row, then a falling-note stage that lands on a keyboard. Committed night-sky look. */
:root{
  --bg:#121735; --panel:#1b2350; --panel2:#262f66; --line:#343f80;
  --ink:#f4f1ff; --muted:#a7acd8; --accent:#ffc94d; --good:#5fe0a4; --bad:#ff8396;
  --display:"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
.app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px;max-width:1240px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;letter-spacing:.2px}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted)}
.midi{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;max-width:100%}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.pill.on i{background:var(--good);box-shadow:0 0 8px var(--good)}
.pill.err i{background:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#2a1f00;border-color:var(--accent);font-family:var(--display);font-size:17px;padding:8px 22px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shelf{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.song{flex:none;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:14px;padding:8px 14px;min-width:140px;display:grid;gap:2px}
.song b{font-family:var(--display);font-weight:500;font-size:16px}
.song span{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.3px}
.song .stars{color:var(--accent);letter-spacing:2px;font-size:13px}
.song[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink)}
label.ctl{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--muted)}
label.ctl output{color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2em}
input[type=range]{accent-color:var(--accent);width:120px}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
select{font:inherit;font-weight:700;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.headR{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.spacer{flex:1}
.score{display:flex;gap:14px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.score em{font-style:normal;color:var(--muted);font-weight:700;margin-right:4px;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.stage{position:relative;flex:1;min-height:280px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#0d1130,#18205a);border:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;background:rgba(27,35,80,.94);border:1px solid var(--line);border-radius:20px;padding:20px 24px;max-width:420px;text-align:center;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.card h2{font-family:var(--display);font-weight:600;margin:0;font-size:26px;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.45}
.card .big{font-family:var(--display);font-size:44px;color:var(--accent);letter-spacing:6px}
.count{font-family:var(--display);font-size:96px;color:var(--accent);text-shadow:0 0 30px rgba(255,201,77,.5)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.4}
.hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-family:inherit;font-weight:700;color:var(--ink)}
@media (max-width:640px){.brand small{display:none}.score{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>Little <span>Keys</span></h1><small>Practice with your own keyboard</small></div>
    <div class="headR">
      <label class="ctl" for="view">View
        <select id="view"><option value="fall">Falling notes</option><option value="sheet">Sheet music</option></select>
      </label>
      <div class="midi">
        <div class="pill" id="midiPill"><i></i><span id="midiText">No piano connected</span></div>
        <button class="btn" id="connectBtn">Connect piano</button>
      </div>
    </div>
  </header>

  <nav class="shelf" id="shelf" aria-label="Songs"></nav>

  <div class="controls">
    <div class="seg" role="group" aria-label="Practice mode">
      <button id="modeWait" aria-pressed="true">Wait for me</button>
      <button id="modePlay" aria-pressed="false">Play in time</button>
    </div>
    <label class="ctl">Speed <input type="range" id="tempo" min="50" max="130" step="5" value="80"><output id="tempoOut">80%</output></label>
    <label class="ctl"><input type="checkbox" id="sound" checked> Sound from device</label>
    <label class="ctl"><input type="checkbox" id="metro"> Click</label>
    <div class="spacer"></div>
    <div class="score"><span><em>Notes</em><span id="sNotes">0/0</span></span><span><em>Streak</em><span id="sStreak">0</span></span></div>
    <button class="btn" id="restartBtn">Restart</button>
    <button class="btn primary" id="startBtn">Start</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="hint">No piano yet? Tap the keys on screen, or use the computer keyboard: <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd> are C D E F G A B C, and <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> are the black keys.</div>
</div>

<script>
(() => {
const NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const COLORS=['#ff6b6b','#ff8f5a','#ffa94d','#ffc94d','#ffe066','#8ce99a','#63e6be','#4dabf7','#748ffc','#9775fa','#da77f2','#f783ac'];
const isBlack=m=>[1,3,6,8,10].includes(((m%12)+12)%12);

// Songs: "NOTE:beats", R = rest. All traditional / public domain melodies.
const SONGS=[
 {id:'warm',title:'Five Finger Walk',level:1,bpm:80,src:'C4:1 D4:1 E4:1 F4:1 G4:2 F4:1 E4:1 D4:1 C4:3 R:1 C4:1 E4:1 G4:2 E4:1 C4:3'},
 {id:'buns',title:'Hot Cross Buns',level:1,bpm:90,src:'E4:1 D4:1 C4:2 E4:1 D4:1 C4:2 C4:.5 C4:.5 C4:.5 C4:.5 D4:.5 D4:.5 D4:.5 D4:.5 E4:1 D4:1 C4:2'},
 {id:'mary',title:'Mary Had a Little Lamb',level:1,bpm:100,src:'E4:1 D4:1 C4:1 D4:1 E4:1 E4:1 E4:2 D4:1 D4:1 D4:2 E4:1 G4:1 G4:2 E4:1 D4:1 C4:1 D4:1 E4:1 E4:1 E4:1 E4:1 D4:1 D4:1 E4:1 D4:1 C4:4'},
 {id:'twinkle',title:'Twinkle Twinkle',level:2,bpm:100,src:'C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 G4:1 G4:1 F4:1 F4:1 E4:1 E4:1 D4:2 C4:1 C4:1 G4:1 G4:1 A4:1 A4:1 G4:2 F4:1 F4:1 E4:1 E4:1 D4:1 D4:1 C4:2'},
 {id:'ode',title:'Ode to Joy',level:2,bpm:100,src:'E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1 E4:1.5 D4:.5 D4:2 E4:1 E4:1 F4:1 G4:1 G4:1 F4:1 E4:1 D4:1 C4:1 C4:1 D4:1 E4:1 D4:1.5 C4:.5 C4:2'},
 {id:'jingle',title:'Jingle Bells',level:3,bpm:110,src:'E4:1 E4:1 E4:2 E4:1 E4:1 E4:2 E4:1 G4:1 C4:1.5 D4:.5 E4:4 F4:1 F4:1 F4:1.5 F4:.5 F4:1 E4:1 E4:1 E4:.5 E4:.5 E4:1 D4:1 D4:1 E4:1 D4:2 G4:2'},
];
const toMidi=s=>{const m=s.match(/^([A-G])(#|b)?(-?\d)$/);const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return (+m[3]+1)*12+pc};
function parse(src){let b=0;const out=[],rests=[];for(const t of src.trim().split(/\s+/)){const[n,d]=t.split(':');const dur=+d;if(n!=='R')out.push({midi:toMidi(n),start:b,dur,state:0});else rests.push({start:b,dur});b+=dur}out.rests=rests;return out}

// ---------- storage ----------
const best=(()=>{try{return JSON.parse(localStorage.getItem('littlekeys.best')||'{}')}catch(e){return{}}})();
function saveBest(){try{localStorage.setItem('littlekeys.best',JSON.stringify(best))}catch(e){}}

// ---------- state ----------
const S={song:null,notes:[],b:-4,playing:false,waiting:false,mode:'wait',tempo:.8,lo:60,hi:72,
  pressed:new Map(),pops:[],stats:{perfect:0,good:0,miss:0,wrong:0},streak:0,finished:false,lastBeat:-99,midiOn:false,keyGlow:new Map()};
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),overlay=$('overlay');
let W=0,H=0,DPR=1;

// ---------- audio ----------
let ac=null;const voices=new Map();
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function synthOn(m){if(!$('sound').checked)return;const a=audio();if(!a)return;synthOff(m,true);
  const f=440*Math.pow(2,(m-69)/12),t=a.currentTime,g=a.createGain(),o1=a.createOscillator(),o2=a.createOscillator();
  o1.type='triangle';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;const g2=a.createGain();g2.gain.value=.25;
  o1.connect(g);o2.connect(g2).connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.008);g.gain.exponentialRampToValueAtTime(.12,t+.5);
  o1.start(t);o2.start(t);voices.set(m,{g,o1,o2})}
function synthOff(m,fast){const v=voices.get(m);if(!v||!ac)return;const t=ac.currentTime;v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.exponentialRampToValueAtTime(.0001,t+(fast?.03:.35));v.o1.stop(t+.4);v.o2.stop(t+.4);voices.delete(m)}
function click(accent){const a=ac;if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.value=accent?1500:1000;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.06)}

// ---------- MIDI ----------
async function connectMidi(){
  const pill=$('midiPill'),txt=$('midiText');
  if(!window.isSecureContext){pill.className='pill err';txt.textContent='MIDI needs an https:// address. This page was opened from a file.';return}
  if(!navigator.requestMIDIAccess){pill.className='pill err';txt.textContent='This browser can’t read MIDI. Use Chrome.';return}
  try{
    const acc=await navigator.requestMIDIAccess({sysex:false});
    const bind=()=>{const ins=[...acc.inputs.values()];ins.forEach(i=>i.onmidimessage=onMidi);
      if(ins.length){pill.className='pill on';txt.textContent=ins.map(i=>i.name).join(', ');if(!S.midiOn){$('sound').checked=false}S.midiOn=true}
      else{pill.className='pill';txt.textContent='Plug in the piano with USB';S.midiOn=false}};
    acc.onstatechange=bind;bind();
  }catch(e){pill.className='pill err';
    txt.textContent=e&&(e.name==='NotAllowedError'||e.name==='SecurityError')
      ?'MIDI permission is off. Tap the icon left of the address bar, then Permissions, then allow MIDI.'
      :'MIDI could not start ('+(e&&e.name||'unknown error')+').'}
}
function onMidi(e){const[st,n,v]=e.data;const c=st&0xF0;if(c===0x90&&v>0)noteOn(n,'midi');else if(c===0x80||(c===0x90&&v===0))noteOff(n)}
$('connectBtn').onclick=connectMidi;

// ---------- input ----------
function noteOn(m,src){audio();if(src!=='midi')synthOn(m);S.pressed.set(m,src);judge(m)}
function noteOff(m){S.pressed.delete(m);synthOff(m)}
const KEYMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74,p:75,';':76};
addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&e.target.type!=='range')return;const m=KEYMAP[e.key.toLowerCase()];if(m!=null){e.preventDefault();noteOn(m,'kb')}else if(e.code==='Space'){e.preventDefault();toggle()}});
addEventListener('keyup',e=>{const m=KEYMAP[e.key.toLowerCase()];if(m!=null)noteOff(m)});
const ptr=new Map();
cv.addEventListener('pointerdown',e=>{const m=keyAt(e.offsetX,e.offsetY);if(m==null)return;cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,m);noteOn(m,'touch')});
const up=e=>{const m=ptr.get(e.pointerId);if(m!=null){noteOff(m);ptr.delete(e.pointerId)}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

// ---------- game logic ----------
const bpm=()=>S.song.bpm*S.tempo;
const secs=beats=>beats*60/bpm();
function pop(text,color,m){
  if(S.view==='sheet'){S.pops.push({text,color,x:SH.playX+SH.sp*4,y:SH.top,t:0});return}
  const k=keyRect(m);S.pops.push({text,color,x:k?k.x+k.w/2:W/2,y:hitY()-20,t:0})}
function hit(n,grade){n.state=grade==='perfect'?1:2;S.stats[grade]++;S.streak++;S.keyGlow.set(n.midi,1);
  pop(grade==='perfect'?(S.streak>=5&&S.streak%5===0?S.streak+' in a row!':'Perfect!'):'Good',grade==='perfect'?'#ffc94d':'#5fe0a4',n.midi);updateScore()}
function judge(m){
  if(!S.song||!S.playing||S.finished)return;
  const pending=S.notes.filter(n=>n.state===0);
  if(S.mode==='wait'){
    const next=pending[0];if(!next)return;
    const group=pending.filter(n=>n.start===next.start);
    const near=S.b>=next.start-.6;
    const target=group.find(n=>n.midi===m);
    if(target&&near){hit(target,'perfect');return}
    if(S.waiting){S.stats.wrong++;S.streak=0;pop('Try '+NAMES[next.midi%12],'#ff8396',m);updateScore()}
    return;
  }
  let bestN=null,bd=1e9;for(const n of pending){if(n.midi!==m)continue;const d=Math.abs(n.start-S.b);if(d<bd){bd=d;bestN=n}}
  const ds=bestN?secs(bd):1e9;
  if(ds<=.12)hit(bestN,'perfect');else if(ds<=.25)hit(bestN,'good');
  else if(S.b>=0){S.stats.wrong++;S.streak=0;pop('Oops','#ff8396',m);updateScore()}
}
function update(dt){
  if(!S.song)return;
  for(const p of S.pops)p.t+=dt;S.pops=S.pops.filter(p=>p.t<.9);
  for(const[k,v]of S.keyGlow){const nv=v-dt*3;nv<=0?S.keyGlow.delete(k):S.keyGlow.set(k,nv)}
  if(!S.playing||S.finished)return;
  let nb=S.b+dt*bpm()/60;
  const pending=S.notes.filter(n=>n.state===0);
  if(S.mode==='wait'){const next=pending[0];if(next&&nb>=next.start){nb=next.start;S.waiting=true}else S.waiting=false}
  else{for(const n of pending){if(secs(nb-n.start)>.25){n.state=3;S.stats.miss++;S.streak=0;pop('Missed','#a7acd8',n.midi);updateScore()}}}
  if($('metro').checked&&Math.floor(nb)>Math.floor(S.b)&&!S.waiting){const beat=Math.floor(nb);click(((beat%4)+4)%4===0)}
  S.b=nb;
  if(S.b<0)showCount(Math.ceil(-S.b));else if(countShown){overlay.innerHTML='';countShown=false}
  const last=S.notes[S.notes.length-1];
  if(!pending.length&&S.b>last.start+last.dur+.5)finish();
}
let countShown=false;
function showCount(n){overlay.innerHTML='<div class="count">'+n+'</div>';countShown=true}
function updateScore(){const done=S.notes.filter(n=>n.state===1||n.state===2).length;$('sNotes').textContent=done+'/'+S.notes.length;$('sStreak').textContent=S.streak}
function accuracy(){const t=S.notes.length,st=S.stats;
  return S.mode==='wait'?t/(t+st.wrong):Math.max(0,(st.perfect+.6*st.good)/(t+st.wrong*.5))}
function finish(){
  S.finished=true;S.playing=false;$('startBtn').textContent='Start';
  const acc=accuracy(),stars=acc>=.9?3:acc>=.7?2:1;
  const key=S.song.id+':'+S.mode;if(!best[key]||best[key]<stars){best[key]=stars;saveBest();renderShelf()}
  const msg=stars===3?'Superstar!':stars===2?'Great playing!':'Nice try, keep going!';
  overlay.innerHTML=`<div class="card"><h2>${msg}</h2><div class="big">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
   <p>${Math.round(acc*100)}% accuracy · ${S.stats.perfect+S.stats.good} of ${S.notes.length} notes${S.mode==='play'?` · ${S.stats.miss} missed`:''} · ${S.stats.wrong} wrong keys</p>
   <div><button class="btn primary" id="againBtn">Play again</button></div></div>`;
  $('againBtn').onclick=()=>{reset();start()};
}
function reset(){S.notes=parse(S.song.src);S.rests=S.notes.rests;S.b=-4;S.waiting=false;S.finished=false;S.stats={perfect:0,good:0,miss:0,wrong:0};S.streak=0;S.pops=[];
  const ms=S.notes.map(n=>n.midi);let lo=Math.min(...ms)-2,hi=Math.max(...ms)+2;
  while(isBlack(lo))lo--;while(isBlack(hi))hi++;while(hi-lo<16){lo--;hi++;while(isBlack(lo))lo--;while(isBlack(hi))hi++}
  S.lo=lo;S.hi=hi;layoutKeys();updateScore()}
let wake=null;
async function start(){audio();if(S.finished)reset();S.playing=true;$('startBtn').textContent='Pause';overlay.innerHTML='';countShown=false;
  try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}
function pause(){S.playing=false;$('startBtn').textContent='Start';try{wake?.release()}catch(e){}wake=null}
function toggle(){S.playing?pause():start()}
$('startBtn').onclick=toggle;
$('restartBtn').onclick=()=>{reset();pause();intro()};

function setMode(m){S.mode=m;$('modeWait').setAttribute('aria-pressed',m==='wait');$('modePlay').setAttribute('aria-pressed',m==='play');reset();pause();intro();renderShelf()}
$('modeWait').onclick=()=>setMode('wait');$('modePlay').onclick=()=>setMode('play');
$('tempo').oninput=e=>{S.tempo=e.target.value/100;$('tempoOut').textContent=e.target.value+'%'};

function renderShelf(){const sh=$('shelf');sh.innerHTML='';
  for(const s of SONGS){const b=document.createElement('button');b.className='song';b.id='song-'+s.id;b.setAttribute('aria-pressed',S.song&&S.song.id===s.id);
    const st=best[s.id+':'+S.mode]||0;
    b.innerHTML=`<b>${s.title}</b><span>${['','EASY','MEDIUM','HARDER'][s.level]} · ${s.bpm} BPM</span><span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span>`;
    b.onclick=()=>{S.song=s;reset();pause();intro();renderShelf()};sh.appendChild(b)}}
function intro(){overlay.innerHTML=S.mode==='wait'
 ?`<div class="card"><h2>${S.song.title}</h2><p>The notes fall down to the keys. The song waits on each note until you press the right key, so take your time.</p><div><button class="btn primary" id="goBtn">Start</button></div></div>`
 :`<div class="card"><h2>${S.song.title}</h2><p>Press each key just as its note touches the line. Lower the speed if it feels too fast.</p><div><button class="btn primary" id="goBtn">Start</button></div></div>`;
 $('goBtn').onclick=start}

// ---------- drawing ----------
let keys=[];
const kbH=()=>Math.min(Math.max(H*.26,90),150);
const hitY=()=>H-kbH();
function layoutKeys(){keys=[];let whites=0;for(let m=S.lo;m<=S.hi;m++)if(!isBlack(m))whites++;
  const ww=W/whites,bw=ww*.6;let wi=0;
  for(let m=S.lo;m<=S.hi;m++){if(isBlack(m))keys.push({m,black:true,x:wi*ww-bw/2,w:bw});else{keys.push({m,black:false,x:wi*ww,w:ww});wi++}}}
const keyRect=m=>keys.find(k=>k.m===m);
function keyAt(x,y){const top=hitY();if(y<top)return null;const bh=kbH()*.62;
  if(y<top+bh){const b=keys.find(k=>k.black&&x>=k.x&&x<k.x+k.w);if(b)return b.m}
  const w=keys.find(k=>!k.black&&x>=k.x&&x<k.x+k.w);return w?w.m:null}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);if(!S.song)return;
  const hy=hitY();
  if(S.view==='sheet')drawSheet(hy);else drawFall(hy);
  drawKeys(hy);drawPops();
}

// ---------- sheet music view ----------
const LETTER_STEP={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
function staffPos(m){let pc=m%12,acc=false;if(LETTER_STEP[pc]==null){pc-=1;acc=true}return{step:(Math.floor(m/12)-1)*7+LETTER_STEP[pc],acc}}
const SH={playX:0,top:0,sp:12};
const MUSIC_FONT='"Noto Music","Bravura","Segoe UI Symbol","Noto Sans Symbols 2",serif';
const INK='#1b1f3a',PAPER='#fbfaff',TARGET='#3b5bff',DONE='#1fa971',MISSED='#b9bcd6';
function drawRest(x,dur,yOf,sp){const mid=yOf(34);ctx.fillStyle=INK;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round';
  if(dur>=4)ctx.fillRect(x-sp*.6,yOf(36),sp*1.2,sp*.5);
  else if(dur>=2)ctx.fillRect(x-sp*.6,mid-sp*.5,sp*1.2,sp*.5);
  else if(dur>=1){ctx.lineWidth=sp*.3;ctx.beginPath();ctx.moveTo(x-sp*.25,mid-sp*1.5);ctx.lineTo(x+sp*.35,mid-sp*.7);ctx.lineTo(x-sp*.25,mid+sp*.1);ctx.lineTo(x+sp*.35,mid+sp*.8);ctx.quadraticCurveTo(x-sp*.6,mid+sp*.6,x-sp*.05,mid+sp*1.5);ctx.stroke()}
  else{ctx.beginPath();ctx.arc(x-sp*.2,mid-sp*.5,sp*.25,0,7);ctx.fill();ctx.lineWidth=sp*.15;ctx.beginPath();ctx.moveTo(x-sp*.2,mid-sp*.4);ctx.lineTo(x+sp*.4,mid-sp*.6);ctx.lineTo(x,mid+sp*.8);ctx.stroke()}
  ctx.lineCap='butt'}
function drawSheet(hy){
  const sp=Math.max(8,Math.min(18,hy/13.5));
  const mid=hy/2,yOf=s=>mid-(s-34)*sp/2,topL=yOf(38),botL=yOf(30);
  const x0=10,x1=W-10,thin=Math.max(1,sp*.09);
  // paper band
  ctx.fillStyle=PAPER;rr(x0,topL-sp*4.2,x1-x0,sp*12.4,14);ctx.fill();
  // staff lines
  ctx.strokeStyle='#2a2e4a';ctx.lineWidth=thin;
  for(let s=30;s<=38;s+=2){const y=yOf(s);ctx.beginPath();ctx.moveTo(x0+12,y);ctx.lineTo(x1-12,y);ctx.stroke()}
  // clef and time signature
  ctx.fillStyle=INK;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font=`${sp*4}px ${MUSIC_FONT}`;ctx.fillText('\u{1D11E}',x0+18,yOf(32));
  const tsx=x0+18+sp*4.2;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 ${sp*2.1}px Nunito, system-ui, sans-serif`;
  ctx.fillText('4',tsx,yOf(36));ctx.fillText('4',tsx,yOf(32));
  const clipX=tsx+sp*1.6,playX=clipX+Math.max(30,W*.08),ppb=Math.max(sp*5,Math.min(140,W/9));
  SH.playX=playX;SH.top=topL-sp*3;SH.sp=sp;
  const X=beat=>playX+(beat-S.b)*ppb;
  ctx.save();ctx.beginPath();ctx.rect(clipX,0,x1-12-clipX,hy);ctx.clip();
  // bar lines
  const last=S.notes[S.notes.length-1],end=Math.ceil((last.start+last.dur)/4)*4,barOff=Math.min(ppb*.4,sp*1.6);
  ctx.strokeStyle='#2a2e4a';
  for(let bt=4;bt<=end;bt+=4){const x=X(bt)-barOff;if(x<clipX-10||x>x1)continue;
    ctx.lineWidth=Math.max(1,sp*.12);ctx.beginPath();ctx.moveTo(x,topL);ctx.lineTo(x,botL);ctx.stroke();
    if(bt===end){ctx.lineWidth=sp*.4;ctx.beginPath();ctx.moveTo(x+sp*.6,topL);ctx.lineTo(x+sp*.6,botL);ctx.stroke()}}
  // rests
  for(const r of S.rests||[]){const x=X(r.start);if(x>clipX-30&&x<x1+30)drawRest(x,r.dur,yOf,sp)}
  // notes
  const next=S.notes.find(n=>n.state===0),rx=sp*.62,ry=sp*.44,lw=Math.max(1,sp*.12);
  for(const n of S.notes){const x=X(n.start);if(x<clipX-40||x>x1+40)continue;
    const{step,acc}=staffPos(n.midi),y=yOf(step);
    const isTarget=n.state===0&&next&&n.start===next.start;
    const col=n.state===1||n.state===2?DONE:n.state===3?MISSED:isTarget?TARGET:INK;
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;
    const ledger=yy=>{ctx.beginPath();ctx.moveTo(x-sp*1.1,yy);ctx.lineTo(x+sp*1.1,yy);ctx.stroke()};
    for(let s=28;s>=step;s-=2)ledger(yOf(s));for(let s=40;s<=step;s+=2)ledger(yOf(s));
    if(isTarget&&S.waiting){ctx.shadowColor=col;ctx.shadowBlur=16}
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,-.35,0,Math.PI*2);
    if(n.dur>=2){ctx.lineWidth=sp*.2;ctx.stroke();ctx.lineWidth=lw}else ctx.fill();
    ctx.shadowBlur=0;
    if(n.dur<4){const up=step<34,sx=up?x+rx-sp*.08:x-rx+sp*.08,ey=up?y-sp*3.4:y+sp*3.4;
      ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(sx,ey);ctx.stroke();
      if(n.dur<1){ctx.lineWidth=sp*.22;ctx.beginPath();ctx.moveTo(sx,ey);ctx.quadraticCurveTo(sx+sp*1.1,up?ey+sp*1.2:ey-sp*1.2,sx+sp*.8,up?ey+sp*2.4:ey-sp*2.4);ctx.stroke();ctx.lineWidth=lw}}
    if([.75,1.5,3].includes(n.dur)){ctx.beginPath();ctx.arc(x+rx+sp*.5,y-(step%2===0?sp*.5:0),sp*.18,0,7);ctx.fill()}
    if(acc){ctx.font=`700 ${sp*1.8}px system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('♯',x-rx-sp*.9,y)}
    // note name bubble above the staff
    const by=Math.min(topL-sp*2,y-sp*4.4);
    ctx.globalAlpha=n.state===0?1:.4;ctx.fillStyle=COLORS[n.midi%12];ctx.beginPath();ctx.arc(x,by,sp*.85,0,7);ctx.fill();
    ctx.fillStyle=INK;ctx.font=`800 ${sp*1.05}px Nunito, system-ui, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(NAMES[n.midi%12],x,by+1);ctx.globalAlpha=1}
  ctx.restore();
  // fade notes that have passed the playhead
  const fg=ctx.createLinearGradient(clipX,0,playX,0);fg.addColorStop(0,'rgba(251,250,255,.92)');fg.addColorStop(1,'rgba(251,250,255,0)');
  ctx.fillStyle=fg;ctx.fillRect(clipX,topL-sp*4.2,playX-clipX,sp*12.4);
  // playhead
  const pg=ctx.createLinearGradient(playX-sp*2,0,playX,0);pg.addColorStop(0,'rgba(59,91,255,0)');pg.addColorStop(1,'rgba(59,91,255,.22)');
  ctx.fillStyle=pg;ctx.fillRect(playX-sp*2,topL-sp*3.6,sp*2,sp*11.2);
  ctx.fillStyle=TARGET;ctx.fillRect(playX-1.5,topL-sp*3.6,3,sp*11.2);
}

// ---------- falling notes view ----------
function drawFall(hy){
  const ppb=Math.max(hy/4.5,40);
  // lanes
  ctx.fillStyle='rgba(255,255,255,.03)';for(const k of keys)if(!k.black&&k.m%12===0)ctx.fillRect(k.x,0,1,hy);
  // beat lines
  ctx.strokeStyle='rgba(167,172,216,.12)';ctx.lineWidth=1;
  for(let b=Math.ceil(S.b);b<S.b+hy/ppb+1;b++){if(b%4)continue;const y=hy-(b-S.b)*ppb;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // notes
  const next=S.notes.find(n=>n.state===0);
  ctx.font='800 13px Nunito, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const n of S.notes){const k=keyRect(n.midi);if(!k)continue;
    const yb=hy-(n.start-S.b)*ppb,yt=yb-n.dur*ppb+3;if(yb<-10||yt>hy+40)continue;
    const pad=k.black?1:4,x=k.x+pad,w=k.w-pad*2,h=yb-yt;
    let col=COLORS[n.midi%12];ctx.globalAlpha=n.state===0?1:n.state===3?.25:.35;
    if(n.state===0&&next&&n.start===next.start&&S.waiting){ctx.shadowColor=col;ctx.shadowBlur=18}
    ctx.fillStyle=col;rr(x,yt,w,h,8);ctx.fill();ctx.shadowBlur=0;
    if(h>20&&w>18){ctx.fillStyle='rgba(20,20,40,.75)';ctx.fillText(NAMES[n.midi%12],x+w/2,yb-11)}
    ctx.globalAlpha=1}
  // hit line
  ctx.fillStyle='rgba(255,201,77,.9)';ctx.fillRect(0,hy-2,W,3);
  const g=ctx.createLinearGradient(0,hy-24,0,hy);g.addColorStop(0,'rgba(255,201,77,0)');g.addColorStop(1,'rgba(255,201,77,.18)');ctx.fillStyle=g;ctx.fillRect(0,hy-24,W,24);
}

// ---------- keyboard ----------
function drawKeys(hy){
  const next=S.notes.find(n=>n.state===0);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const kh=kbH(),bh=kh*.62;const targets=new Set(S.waiting&&next?S.notes.filter(n=>n.state===0&&n.start===next.start).map(n=>n.midi):[]);
  const pulse=.5+.5*Math.sin(performance.now()/180);
  for(const k of keys){if(k.black)continue;const on=S.pressed.has(k.m),glow=S.keyGlow.get(k.m)||0;
    ctx.fillStyle=on?COLORS[k.m%12]:'#f6f4ff';rr(k.x+1,hy+2,k.w-2,kh-4,6);ctx.fill();
    if(targets.has(k.m)){ctx.fillStyle=COLORS[k.m%12];ctx.globalAlpha=.25+.35*pulse;rr(k.x+1,hy+2,k.w-2,kh-4,6);ctx.fill();ctx.globalAlpha=1}
    if(glow){ctx.fillStyle='rgba(255,201,77,'+glow*.6+')';rr(k.x+1,hy+2,k.w-2,kh-4,6);ctx.fill()}
    if(k.w>16){ctx.fillStyle=k.m%12===0?'#262f66':'#8a8fb8';ctx.font=(k.m%12===0?'800 ':'700 ')+'12px Nunito, system-ui';ctx.fillText(NAMES[k.m%12]+(k.m%12===0?Math.floor(k.m/12)-1:''),k.x+k.w/2,hy+kh-14)}}
  for(const k of keys){if(!k.black)continue;const on=S.pressed.has(k.m);
    ctx.fillStyle=on?COLORS[k.m%12]:'#1a1d33';rr(k.x,hy+2,k.w,bh,4);ctx.fill();
    if(targets.has(k.m)){ctx.fillStyle=COLORS[k.m%12];ctx.globalAlpha=.4+.4*pulse;rr(k.x,hy+2,k.w,bh,4);ctx.fill();ctx.globalAlpha=1}}
}
function drawPops(){
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 20px Fredoka, system-ui, sans-serif';
  for(const p of S.pops){ctx.globalAlpha=1-p.t/.9;ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y-p.t*40)}ctx.globalAlpha=1;
}
function resize(){DPR=window.devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*DPR;cv.height=H*DPR;if(S.song)layoutKeys()}
new ResizeObserver(resize).observe(stage);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}

// view select
try{S.view=localStorage.getItem('littlekeys.view')||'fall'}catch(e){S.view='fall'}
$('view').value=S.view;
$('view').onchange=e=>{S.view=e.target.value;S.pops=[];try{localStorage.setItem('littlekeys.view',S.view)}catch(err){}};
try{document.fonts.load('40px "Noto Music"','\u{1D11E}')}catch(e){}

// boot
S.song=SONGS[3];resize();reset();S.b=-1.5;renderShelf();intro();requestAnimationFrame(loop);
if(navigator.requestMIDIAccess&&navigator.permissions){navigator.permissions.query({name:'midi'}).then(p=>{if(p.state==='granted')connectMidi()}).catch(()=>{})}
})();
</script>
